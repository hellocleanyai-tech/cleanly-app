[build]
  publish  = "public"
  command  = "node scripts/build-config.mjs"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------------- routing --
# Clean URLs. Marketing at /, auth at /login, dashboard at /app — one domain.

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/account.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Anything unmatched renders the styled 404 rather than Netlify's default.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ---------------------------------------------------------------- headers --

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Authenticated pages must never be cached by a shared proxy.
[[headers]]
  for = "/app"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/account"
  [headers.values]
    Cache-Control = "no-store"

# env.js is regenerated per build, so it must not be cached long.
[[headers]]
  for = "/assets/js/env.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Version-pinned filename, so it can be cached indefinitely.
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
